<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe2c3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Drop paper cutouts into the jar and grow a seed all the way into a melon.">
  <meta property="og:title" content="Melon">
  <meta property="og:description" content="Drop paper cutouts into the jar and grow a seed all the way into a melon.">
  <title>Melon</title>
  <script>
    // pick the theme before first paint so the margins don't flash
    try {
      var d = JSON.parse(localStorage.getItem('melon_dark'));
      if (d === null) d = matchMedia('(prefers-color-scheme: dark)').matches;
      if (d) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='54' r='42' fill='%23cdb86c' stroke='%23fbf5e6' stroke-width='5'/><path d='M50 12 q4 -8 12 -8' stroke='%237a6630' stroke-width='6' fill='none'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap">
  <link rel="modulepreload" href="js/constants.js">
  <link rel="modulepreload" href="js/paper.js">
  <link rel="modulepreload" href="js/items.js">
  <link rel="modulepreload" href="js/physics.js">
  <link rel="modulepreload" href="js/fx.js">
  <link rel="modulepreload" href="js/audio.js">
  <link rel="modulepreload" href="js/haptics.js">
  <link rel="modulepreload" href="js/render.js">
  <link rel="modulepreload" href="js/run.js">
  <link rel="modulepreload" href="js/net.js">
  <link rel="modulepreload" href="js/es.js">
  <link rel="modulepreload" href="js/es-lessons.js">
  <link rel="modulepreload" href="js/game.js">
  <style>
    :root {
      --bg: #efe2c3;
      --paper: #fbf5e6;
      --ink: #4a3426;
      --ink-soft: rgba(74, 52, 38, 0.6);
      --accent: #c0453b;
      --gold: #c98a12;
      --scrim: rgba(239, 226, 195, 0.55);
      --cream: #fbf5e6;
    }
    :root[data-theme="dark"] {
      --bg: #2a2638;
      --paper: #3d3750;
      --ink: #efe2c3;
      --ink-soft: rgba(239, 226, 195, 0.6);
      --gold: #e2a93a;
      --scrim: rgba(30, 26, 44, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Mali', 'Comic Sans MS', sans-serif;
      color: var(--ink);
    }

    #game {
      display: block;
      touch-action: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--scrim);
      transition: opacity 0.25s;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      background: var(--paper);
      padding: 26px 34px 24px;
      text-align: center;
      border-radius: 14px 10px 16px 9px;
      box-shadow: 4px 6px 0 rgba(60, 35, 15, 0.22);
      transform: rotate(-1.5deg);
      min-width: 230px;
    }
    .overlay.hidden .card { transform: rotate(-1.5deg) scale(0.92); }
    .card { transition: transform 0.25s cubic-bezier(.3, 1.6, .5, 1); }

    .title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 14px;
    }
    .label {
      font-size: 14px;
      color: var(--ink-soft);
    }
    .big {
      font-size: 51px;
      font-weight: 700;
      line-height: 0.95;
    }
    .row {
      font-size: 16px;
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .row.gold {
      color: var(--gold);
      font-weight: 700;
    }

    button {
      margin-top: 18px;
      font: 700 21px 'Mali', 'Comic Sans MS', sans-serif;
      color: var(--cream);
      background: var(--accent);
      border: none;
      padding: 6px 32px 8px;
      border-radius: 10px 14px 9px 13px;
      box-shadow: 2px 4px 0 rgba(60, 35, 15, 0.25);
      cursor: pointer;
      transform: rotate(1deg);
    }
    button:active {
      transform: rotate(1deg) translate(2px, 3px);
      box-shadow: 0 1px 0 rgba(60, 35, 15, 0.25);
    }
    [hidden] { display: none !important; }

    .vs {
      font-size: 17px;
      font-weight: 700;
      margin-top: 6px;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button.ghost {
      margin-top: 0;
      font-size: 15px;
      padding: 3px 14px 5px;
      color: var(--ink);
      background: transparent;
      box-shadow: inset 0 0 0 2px var(--ink-soft);
      transform: rotate(-1deg);
    }
    button.ghost:active {
      transform: rotate(-1deg) translate(1px, 2px);
      box-shadow: inset 0 0 0 2px var(--ink-soft);
    }
    .who {
      margin-top: 14px;
      font-size: 13px;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .who i { font-style: normal; }
    .who span {
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }

    .rank { min-height: 1.2em; }

    #board .card {
      width: min(330px, calc(100vw - 32px));
      padding: 18px 18px 16px;
      transform: rotate(1deg);
    }
    #board.hidden .card { transform: rotate(1deg) scale(0.92); }
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .tabs button { margin-top: 0; }
    .tabs button.on {
      background: var(--ink);
      color: var(--paper);
      box-shadow: none;
    }
    #board-list {
      list-style: none;
      margin: 12px 0 4px;
      max-height: min(52vh, 420px);
      overflow-y: auto;
      text-align: left;
      font-size: 16px;
    }
    #board-list li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 8px;
      cursor: pointer;
    }
    #board-list li:active { background: var(--scrim); }
    #board-list li.me { color: var(--accent); font-weight: 700; }
    #board-list .rk { width: 2.2em; text-align: right; color: var(--ink-soft); }
    #board-list .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #board-list .sc { font-weight: 700; }
    #board-list .pl { font-size: 10px; color: var(--ink-soft); }
    #board-close { margin-top: 12px; }
    #board-list .empty { justify-content: center; color: var(--ink-soft); cursor: default; }

    #lesson .card {
      width: min(350px, calc(100vw - 24px));
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      text-align: left;
      padding: 16px 16px 12px;
      transform: rotate(0.8deg);
    }
    #lesson.hidden .card { transform: rotate(0.8deg) scale(0.92); }
    .ls-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .ls-head small {
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-soft);
    }
    #ls-lines { margin: 10px 0 4px; }
    .ln {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: 7px 0;
    }
    .ln.me { flex-direction: row-reverse; }
    .ln button.who {
      margin: 3px 0 0;
      padding: 1px 7px 2px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      background: none;
      box-shadow: inset 0 0 0 1.5px var(--ink-soft);
      border-radius: 9px;
      transform: none;
      flex-shrink: 0;
    }
    .bubble {
      background: var(--scrim);
      border-radius: 4px 13px 13px 13px;
      padding: 5px 10px 6px;
      max-width: 82%;
    }
    .ln.me .bubble {
      background: rgba(192, 69, 59, 0.13);
      border-radius: 13px 4px 13px 13px;
    }
    .bubble p {
      font-size: 18px;
      line-height: 1.3;
    }
    .bubble p.tr {
      display: none;
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 1px;
    }
    #lesson.english .bubble p.tr { display: block; }
    #lesson .w {
      cursor: pointer;
      border-radius: 4px;
    }
    #lesson .w.seen {
      text-decoration: underline dotted var(--ink-soft);
      text-underline-offset: 3px;
    }
    #lesson .w.key { font-weight: 700; }
    #lesson .w.on { background: #f7c94877; }
    .ls-phrase {
      margin-top: 10px;
      padding: 8px 12px 9px;
      border-radius: 10px 14px 9px 13px;
      box-shadow: inset 0 0 0 2px var(--gold);
      text-align: center;
    }
    .ls-phrase .label {
      font-size: 12px;
      color: var(--gold);
      font-weight: 600;
    }
    #ls-phrase {
      font-size: 21px;
      font-weight: 700;
    }
    #ls-phrase-en {
      font-size: 14px;
      color: var(--ink-soft);
    }
    .ls-gloss {
      min-height: 1.5em;
      margin-top: 6px;
      font-size: 14px;
      color: var(--ink-soft);
      text-align: center;
    }
    .ls-gloss b { color: var(--ink); }
    .ls-gloss .hear { all: unset; cursor: pointer; padding: 2px 6px; font-size: 16px; vertical-align: middle; }
    #lesson .actions { margin-top: 6px; }
    #ls-next { display: block; margin: 10px auto 0; }
    .ls-foot {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    button.ls-arrow {
      margin: 0;
      padding: 0 10px 2px;
      font-size: 20px;
      line-height: 1;
      background: none;
      box-shadow: none;
      color: var(--ink);
      transform: none;
    }
    button.ls-arrow:disabled { opacity: 0.2; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(40px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: var(--bg);
      font-size: 16px;
      font-weight: 700;
      padding: 4px 16px 6px;
      border-radius: 10px 13px 9px 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div class="title" id="over-title">jar's full!</div>
      <div class="label" data-es="puntos">score</div>
      <div class="big" id="over-score">0</div>
      <div class="row" id="over-best"></div>
      <div class="row" id="over-biggest"></div>
      <div class="vs" id="over-vs" hidden></div>
      <div class="row rank" id="over-rank"></div>
      <button id="again" data-es="otra vez">again</button>
      <div class="actions">
        <button class="ghost" id="watch" data-es="▶ repetir">▶ replay</button>
        <button class="ghost" id="share">challenge</button>
        <button class="ghost" id="watch-them" hidden></button>
        <button class="ghost" id="open-board" data-es="🏆 tabla">🏆 board</button>
      </div>
      <div class="who"><i data-es="juegas como">playing as</i> <span id="who"></span> ✎</div>
    </div>
  </div>
  <div id="board" class="overlay hidden">
    <div class="card">
      <div class="tabs">
        <button class="ghost on" data-b="day" data-es="hoy">today</button>
        <button class="ghost" data-b="all" data-es="histórico">all time</button>
      </div>
      <ol id="board-list"></ol>
      <div class="row" id="board-me"></div>
      <button class="ghost" id="board-close" data-es="volver">back</button>
    </div>
  </div>
  <div id="lesson" class="overlay hidden">
    <div class="card">
      <div class="ls-head"><span id="ls-scene"></span><small id="ls-scene-en"></small></div>
      <div id="ls-lines"></div>
      <div class="ls-phrase">
        <div class="label">★ frase nueva</div>
        <div id="ls-phrase" lang="es"></div>
        <div id="ls-phrase-en"></div>
      </div>
      <div class="ls-gloss" id="ls-gloss"></div>
      <div class="actions">
        <button class="ghost" id="ls-say">🔊 escuchar</button>
        <button class="ghost" id="ls-tr">inglés</button>
      </div>
      <button id="ls-next">seguir</button>
      <div class="ls-foot">
        <button class="ls-arrow" id="ls-prev" aria-label="anterior">‹</button>
        <span id="ls-n"></span>
        <button class="ls-arrow" id="ls-fwd" aria-label="siguiente">›</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
